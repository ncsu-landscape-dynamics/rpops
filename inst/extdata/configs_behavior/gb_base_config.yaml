# ── Behavior module ──────────────────────────────────────────────────────────
# Toggle: mirrors use_movements, use_lethal_temperature, etc.
use_behavior_module: true

# Path to a GeoTIFF with integer grower/management-unit IDs (0 = background).
# Produced by delineate_management_units() and saved as a .tif.
grower_id_file: simple2x2/grower_id.tif

# Path to a CSV with grower-specific parameters.  Must have a column named
# `grower_id` matching the IDs in grower_id_file, plus any parameter columns
# (detection_prob, willingness_to_treat, treatment_efficacy, decision_threshold).
# Rows with IDs not present in the raster are silently ignored.
grower_params_file: simple2x2/grower_params.csv

# Dates on which growers make treatment decisions (YYYY-MM-DD).
# Must fall within [start_date, end_date].
behavior_decision_dates:
  - '2008-05-01'
  - '2009-05-01'

# Global fallback behavior parameters (used when grower_params_file is not
# supplied or a grower_id is absent from the table).
# One entry per grower type; each entry is a named list.
behavior_params:
  - detection_prob: 0.7
    willingness_to_treat: 0.6
    treatment_efficacy: 0.8
    decision_threshold: 0.05
  - detection_prob: 0.4
    willingness_to_treat: 0.3
    treatment_efficacy: 0.8
    decision_threshold: 0.15
